<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VENCE — Core</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#eceef1;--text:#101214;--muted:#6b7280;--line:rgba(0,0,0,.13);--g1:rgba(255,255,255,.8);--g2:rgba(255,255,255,.4);--dot:#9aa0a8;--btn:#101214;--btnt:#fff;--grid:rgba(0,0,0,.05);--sh:0 20px 50px rgba(0,0,0,.12);--sheet:#f4f5f7;--acc:#ff4b24;--late:#e0173f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#080a0d;--text:#f4f5f6;--muted:#8e949d;--line:rgba(255,255,255,.11);--g1:rgba(255,255,255,.075);--g2:rgba(255,255,255,.025);--dot:#777d84;--btn:#f2f3f4;--btnt:#090a0c;--grid:rgba(255,255,255,.035);--sh:0 25px 70px rgba(0,0,0,.42);--sheet:#10131a;--late:#ff2d55}}
:root[data-theme="dark"]{--bg:#080a0d;--text:#f4f5f6;--muted:#8e949d;--line:rgba(255,255,255,.11);--g1:rgba(255,255,255,.075);--g2:rgba(255,255,255,.025);--dot:#777d84;--btn:#f2f3f4;--btnt:#090a0c;--grid:rgba(255,255,255,.035);--sh:0 25px 70px rgba(0,0,0,.42);--sheet:#10131a;--late:#ff2d55}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 75% 10%,rgba(255,75,36,.14),transparent 30%),radial-gradient(circle at 12% 80%,rgba(120,130,150,.1),transparent 26%),var(--bg);color:var(--text);font-family:"Space Grotesk",system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:26px 26px;-webkit-mask-image:linear-gradient(to bottom,#000,transparent 90%);mask-image:linear-gradient(to bottom,#000,transparent 90%)}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace}
.wrap{position:relative;width:min(100%,520px);margin:auto;padding:22px 16px 130px}
.rise{animation:rise .8s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d,0s)}
@keyframes rise{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.brand{font-weight:700;letter-spacing:.18em;font-size:14px}
.status{font:500 9px "JetBrains Mono",monospace;letter-spacing:.14em;color:var(--muted)}
.status i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--acc);box-shadow:0 0 12px var(--acc);margin-right:6px}
.core{position:relative;overflow:hidden;min-height:430px;border:1px solid var(--line);border-radius:30px;background:radial-gradient(circle at 50% 43%,rgba(255,75,36,.13),transparent 26%),linear-gradient(145deg,var(--g1),var(--g2));backdrop-filter:blur(22px) saturate(135%);-webkit-backdrop-filter:blur(22px) saturate(135%);box-shadow:var(--sh),inset 0 1px rgba(255,255,255,.1)}
.core::after{content:"";position:absolute;width:230px;height:230px;left:50%;top:43%;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(255,75,36,.16),transparent 68%);filter:blur(12px);pointer-events:none}
.label{position:absolute;top:22px;left:23px;font:600 9px "JetBrains Mono",monospace;letter-spacing:.18em;color:var(--muted)}
.index{position:absolute;top:22px;right:23px;font:500 10px "JetBrains Mono",monospace;color:var(--muted)}
.orbit{position:absolute;left:50%;top:43%;width:280px;height:280px;transform:translate(-50%,-50%);border:1px solid var(--line);border-radius:50%}
.orbit::before,.orbit::after{content:"";position:absolute;inset:25px;border:1px solid var(--line);border-radius:50%;opacity:.7}
.orbit::after{inset:58px;border-color:rgba(255,75,36,.25);opacity:1}
.ring{position:absolute;inset:12px;border-radius:50%;border:1px dashed var(--line);animation:spin 18s linear infinite}
.ring::before{content:"";position:absolute;width:5px;height:5px;border-radius:50%;background:var(--acc);box-shadow:0 0 14px 3px rgba(255,75,36,.65);left:50%;top:-3px}
@keyframes spin{to{transform:rotate(360deg)}}
.cross{position:absolute;left:50%;top:50%;width:100%;height:1px;background:var(--line);opacity:.6;transform:translate(-50%,-50%)}
.cross.v{transform:translate(-50%,-50%) rotate(90deg)}
.cn{position:absolute;left:50%;top:43%;transform:translate(-50%,-55%);text-align:center;z-index:3}
.days{font-size:82px;line-height:.82;font-weight:600;letter-spacing:-.07em}
.days span{font:500 10px "JetBrains Mono",monospace;display:block;margin-top:13px;letter-spacing:.2em;color:var(--muted)}
.pulse{width:9px;height:9px;border-radius:50%;background:var(--acc);margin:15px auto 0;animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,75,36,.5)}70%{box-shadow:0 0 0 12px rgba(255,75,36,0)}100%{box-shadow:0 0 0 0 rgba(255,75,36,0)}}
.dot{position:absolute;width:24px;height:24px;margin:-12px 0 0 -12px;padding:0;border:0;background:none;cursor:pointer;z-index:4;animation:pop .6s cubic-bezier(.2,1.7,.4,1) both}
.dot::before{content:"";position:absolute;inset:8.5px;border-radius:50%;background:var(--dot);box-shadow:0 0 8px rgba(255,255,255,.2)}
.dot.hot::before{background:var(--acc);box-shadow:0 0 13px rgba(255,75,36,.85)}
.dot.late::before{background:var(--late);box-shadow:0 0 12px var(--late);animation:blink 1.6s ease-in-out infinite}
@keyframes pop{from{opacity:0;transform:scale(0)}to{opacity:1;transform:scale(1)}}
@keyframes blink{50%{opacity:.45}}
.info{position:absolute;left:22px;right:22px;bottom:21px;display:flex;justify-content:space-between;align-items:flex-end;gap:15px;z-index:5}
.info small{display:block;font:500 8px "JetBrains Mono",monospace;color:var(--muted);letter-spacing:.13em;margin-bottom:6px}
.nme{font-size:18px;font-weight:600}
.dte{margin-top:3px;color:var(--muted);font:500 10px "JetBrains Mono",monospace}
.pill{border:0;background:var(--btn);color:var(--btnt);border-radius:999px;padding:11px 14px;font:700 9px "JetBrains Mono",monospace;letter-spacing:.08em;cursor:pointer;white-space:nowrap;transition:transform .3s cubic-bezier(.2,1.4,.4,1)}
.pill:active{transform:scale(.94)}
.legend{display:flex;justify-content:space-between;margin:13px 0 20px;padding:0 5px;color:var(--muted);font:500 8px "JetBrains Mono",monospace;letter-spacing:.09em}
.legend b{color:var(--acc);font-weight:500}
.fl{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-bottom:12px}
.fl::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:linear-gradient(145deg,var(--g1),var(--g2));color:var(--text);font:500 10px "JetBrains Mono",monospace;letter-spacing:.1em;padding:10px 14px;border-radius:999px;cursor:pointer;white-space:nowrap;transition:all .3s}
.chip b{color:var(--acc);margin-left:5px;font-weight:600}
.chip.on{background:var(--btn);color:var(--btnt);border-color:var(--btn)}
.q{width:100%;font:500 12px "JetBrains Mono",monospace;letter-spacing:.08em;color:var(--text);background:linear-gradient(145deg,var(--g1),var(--g2));border:1px solid var(--line);border-radius:999px;padding:13px 18px;outline:0}
.q::placeholder{color:var(--muted)}
.gm{margin:10px 6px 0;font:500 9px "JetBrains Mono",monospace;letter-spacing:.14em;color:var(--muted)}
.gh{font:600 9px "JetBrains Mono",monospace;letter-spacing:.18em;color:var(--muted);margin:22px 6px 10px}
.row{position:relative;display:flex;align-items:center;gap:12px;padding:13px 14px;border:1px solid var(--line);border-radius:22px;margin-bottom:10px;background:linear-gradient(145deg,var(--g1),var(--g2));backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);cursor:pointer;transition:transform .25s;animation:rise .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d)}
.row:active{transform:scale(.98)}
.sd{width:8px;height:8px;border-radius:50%;background:var(--dot);flex:none}
.s-r .sd{background:var(--late);box-shadow:0 0 10px var(--late)}.s-a .sd{background:var(--acc);box-shadow:0 0 10px var(--acc)}
.rinfo{flex:1;min-width:0}
.nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mt{font:500 9px "JetBrains Mono",monospace;letter-spacing:.06em;color:var(--muted);margin-top:3px}
.tg{font:600 10px "JetBrains Mono",monospace;letter-spacing:.06em;padding:6px 10px;border-radius:999px;border:1px solid var(--line);white-space:nowrap}
.s-r .tg{color:var(--late);border-color:var(--late)}.s-a .tg{color:var(--acc);border-color:var(--acc)}
.rn{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:none;color:var(--text);font-size:15px;cursor:pointer;flex:none;transition:transform .5s}
.rn:active{transform:rotate(360deg)}
.empty{text-align:center;color:var(--muted);padding:34px 10px;font:500 11px "JetBrains Mono",monospace;letter-spacing:.08em;line-height:1.8}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;justify-content:center;padding:0 16px calc(16px + env(safe-area-inset-bottom,0px));pointer-events:none}
.newb{pointer-events:auto;display:flex;align-items:center;gap:16px;border:0;border-radius:999px;background:var(--btn);color:var(--btnt);padding:8px 8px 8px 24px;font:700 11px "JetBrains Mono",monospace;letter-spacing:.12em;cursor:pointer;box-shadow:0 14px 36px rgba(0,0,0,.35);transition:transform .3s cubic-bezier(.2,1.4,.4,1)}
.newb:active{transform:scale(.95)}
.newb i{width:44px;height:44px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;font-style:normal;font-size:24px;font-weight:300;box-shadow:0 0 20px rgba(255,75,36,.6);transition:transform .4s}
.newb:hover i{transform:rotate(90deg)}
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;z-index:6;border-radius:999px;background:var(--btn);color:var(--btnt);padding:9px 10px 9px 18px;font:600 11px "JetBrains Mono",monospace;letter-spacing:.06em;display:flex;gap:12px;align-items:center;transition:all .4s cubic-bezier(.2,.8,.2,1);white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{border:0;background:var(--acc);color:#fff;font:700 10px "JetBrains Mono",monospace;padding:7px 12px;border-radius:999px;cursor:pointer}
.sheet{position:fixed;inset:0;z-index:9;background:rgba(0,0,0,.55);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);display:none;align-items:flex-end;justify-content:center}
.sheet.on{display:flex}
.form{width:100%;max-width:520px;border-radius:30px 30px 0 0;border:1px solid var(--line);padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));display:grid;gap:10px;background:var(--sheet);color:var(--text);animation:up .45s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(60%);opacity:0}to{transform:none;opacity:1}}
.form h2{margin:0 0 2px;font:600 10px "JetBrains Mono",monospace;letter-spacing:.2em;color:var(--acc)}
.form input,.form select{font:inherit;font-size:16px;color:var(--text);background:linear-gradient(145deg,var(--g1),var(--g2));border:1px solid var(--line);border-radius:16px;padding:13px 14px;width:100%;min-width:0;outline:0}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;gap:8px}
.chips .chip{padding:8px 13px}
.save{border:0;border-radius:999px;background:var(--btn);color:var(--btnt);font:700 12px "JetBrains Mono",monospace;letter-spacing:.14em;padding:16px;cursor:pointer}
.rm{border:0;background:none;color:var(--late);font:600 10px "JetBrains Mono",monospace;letter-spacing:.12em;cursor:pointer;padding:6px;display:none}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="wrap">
<div class="top rise"><div class="brand">VENCE</div><div class="status"><i></i>SISTEMA ACTIVO <span id="clk"></span></div></div>
<section class="core rise" style="--d:.1s">
<div class="label">VENCE / CORE</div><div class="index" id="idx">00 ITEMS</div>
<div class="orbit"><div class="ring"></div><div class="cross"></div><div class="cross v"></div></div>
<div id="dots"></div>
<div class="cn"><div class="days"><b id="dN" style="font-weight:600">—</b><span id="dL">DÍAS RESTANTES</span></div><div class="pulse"></div></div>
<div class="info"><div><small>PRÓXIMO VENCIMIENTO</small><div class="nme" id="nName">—</div><div class="dte" id="nDate"></div></div><button class="pill" id="renew">RENOVAR ↻</button></div>
</section>
<div class="legend rise" style="--d:.2s" id="legend"></div>
<div class="fl rise" style="--d:.25s" id="fl"></div>
<input class="q rise" style="--d:.3s" id="q" placeholder="BUSCAR…">
<div class="gm" id="gm"></div>
<div id="list"></div>
</main>
<div class="dock"><button class="newb" id="open">NUEVO VENCIMIENTO<i>+</i></button></div>
<div class="toast" id="toast"></div>
<div class="sheet" id="sheet"><form class="form" id="f">
<h2 id="ft">NUEVO VENCIMIENTO</h2>
<input id="name" placeholder="¿Qué vence? Ej. Seguro del auto" required maxlength="60">
<div class="r2"><select id="cat"><option value="📄">📄 Contrato</option><option value="🛡️">🛡️ Seguro</option><option value="🔧">🔧 Garantía</option><option value="🪪">🪪 Documento</option><option value="📺">📺 Suscripción</option><option value="📌">📌 Otro</option></select><input id="date" type="date" required></div>
<div class="chips"><button type="button" class="chip" data-add="1">+1 MES</button><button type="button" class="chip" data-add="12">+1 AÑO</button><button type="button" class="chip" data-add="36">+3 AÑOS</button></div>
<div class="r2"><input id="cost" type="number" min="0" step="any" inputmode="decimal" placeholder="Costo $ (opcional)"><select id="per"><option value="y">Renueva cada año</option><option value="m">Renueva cada mes</option><option value="n">No renueva</option></select></div>
<button class="save" type="submit">GUARDAR</button>
<button class="rm" type="button" id="rm">ELIMINAR ESTE VENCIMIENTO</button>
</form></div>
<script>
var KEY="vence-mix-v1",items=[],flt="",q="",editId=null,first=true,tt,nx=null;
var FL=[["","TODOS"],["r","VENCIDOS"],["a","PRÓXIMOS"],["g","AL DÍA"]];
function $(i){return document.getElementById(i)}
function fmt(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function addM(s,m){var d=new Date(s+"T00:00:00");d.setMonth(d.getMonth()+m);return fmt(d)}
function days(s){var t=new Date();t.setHours(0,0,0,0);return Math.round((new Date(s+"T00:00:00")-t)/864e5)}
function esc(s){return s.replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function st(i){var n=days(i.d);return n<0?"r":n<=30?"a":"g"}
function ds(s){return new Date(s+"T00:00:00").toLocaleDateString("es",{day:"numeric",month:"short",year:"numeric"}).toUpperCase().replace(/\./g,"")}
function load(){try{var r=localStorage.getItem(KEY);if(r)items=JSON.parse(r)}catch(e){}
if(!items.length){var d=function(n){var x=new Date();x.setDate(x.getDate()+n);return fmt(x)};
items=[{id:1,n:"Seguro del auto",c:"🛡️",d:d(12),m:480,p:"y"},{id:2,n:"Garantía del refrigerador",c:"🔧",d:d(200),m:0,p:"n"},{id:3,n:"Renovar pasaporte",c:"🪪",d:d(-5),m:0,p:"n"},{id:4,n:"Plan de streaming",c:"📺",d:d(20),m:12,p:"m"},{id:5,n:"Contrato de alquiler",c:"📄",d:d(95),m:0,p:"y"}]}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(items))}catch(e){}}
function cnt(el,to){var from=parseInt(el.textContent)||0,t0=null;
if(matchMedia("(prefers-reduced-motion: reduce)").matches||from===to){el.textContent=to;return}
function step(t){if(!t0)t0=t;var p=Math.min((t-t0)/900,1),e=1-Math.pow(1-p,3);el.textContent=Math.round(from+(to-from)*e);if(p<1)requestAnimationFrame(step)}
requestAnimationFrame(step)}
function toast(msg,undo){var t=$("toast");t.innerHTML=esc(msg)+(undo?'<button id="undo">DESHACER</button>':"");t.classList.add("on");
if(undo)$("undo").onclick=function(){undo();t.classList.remove("on")};clearTimeout(tt);tt=setTimeout(function(){t.classList.remove("on")},5000)}
function renew(it){var n=0;do{it.d=addM(it.d,it.p==="m"?1:12);n++}while(days(it.d)<0&&n<600)}
function p2(n){return String(n).padStart(2,"0")}
function render(){
items.sort(function(a,b){return days(a.d)-days(b.d)});
var c={r:0,a:0,g:0},gm=0,tx={r:"VENCIDOS",a:"PRÓXIMOS 30 DÍAS",g:"MÁS ADELANTE"};
items.forEach(function(i){c[st(i)]++;if(i.m){var v=+i.m;if(i.p==="m")gm+=v;else if(i.p!=="n")gm+=v/12}});
var up=items.filter(function(i){return days(i.d)>=0});nx=up[0]||null;
$("idx").textContent=p2(items.length)+" ITEMS";
if(nx){cnt($("dN"),days(nx.d));$("dL").textContent=days(nx.d)===0?"VENCE HOY":"DÍAS RESTANTES";$("nName").textContent=nx.c+" "+nx.n;$("nDate").textContent=ds(nx.d)+(nx.m?" · $"+nx.m:"");$("renew").style.display=nx.p==="n"?"none":"block"}
else{$("dN").textContent="—";$("dL").textContent="SIN PENDIENTES";$("nName").textContent="Todo al día";$("nDate").textContent="";$("renew").style.display="none"}
var dh="";items.forEach(function(i,k){var n=days(i.d),rad=n<0?146:80+Math.min(1,Math.log(1+n)/Math.log(366))*58,a=(k*137.5+30)*Math.PI/180;
dh+='<button class="dot'+(nx&&i.id===nx.id?" hot":n<0?" late":"")+'" data-id="'+i.id+'" title="'+esc(i.n)+'" style="left:calc(50% + '+(rad*Math.cos(a)).toFixed(1)+'px);top:calc(43% + '+(rad*Math.sin(a)).toFixed(1)+'px);animation-delay:'+(.3+k*.08)+'s"></button>'});
$("dots").innerHTML=dh;
var lg=up.slice(0,4).map(function(i){return "<span><b>●</b> "+days(i.d)+"D</span>"}).join("");
$("legend").innerHTML=lg+"<span>"+p2(items.length)+" TRACKED</span>";
$("fl").innerHTML=FL.map(function(f){var n=f[0]?c[f[0]]:items.length;return '<button class="chip'+(flt===f[0]?" on":"")+'" data-f="'+f[0]+'">'+f[1]+'<b>'+n+'</b></button>'}).join("");
$("gm").textContent=gm>0?"≈ $"+Math.round(gm)+" / MES EN PAGOS RECURRENTES":"";
var h="",k=0;
["r","a","g"].forEach(function(g){var arr=items.filter(function(i){return st(i)===g&&(!flt||flt===g)&&(!q||i.n.toLowerCase().indexOf(q)>-1)});
if(!arr.length)return;h+='<div class="gh">'+tx[g]+'</div>';
arr.forEach(function(i){var n=days(i.d);
h+='<div class="row s-'+g+'" data-id="'+i.id+'" style="--d:'+(first?.35+k*.06:k*.04)+'s"><i class="sd"></i><div class="rinfo"><div class="nm">'+i.c+" "+esc(i.n)+'</div><div class="mt">'+ds(i.d)+(i.m?" · $"+i.m:"")+(i.p==="n"?"":" · ↻ "+(i.p==="m"?"MES":"AÑO"))+'</div></div><span class="tg">'+(n<0?"HACE "+(-n)+" D":n===0?"HOY":n+" D")+'</span>'+(i.p==="n"?"":'<button class="rn" data-a="ren" aria-label="Renovar">↻</button>')+'</div>';k++})});
$("list").innerHTML=h||'<div class="empty">NADA POR AQUÍ<br>TOCA “NUEVO VENCIMIENTO” PARA EMPEZAR</div>';first=false}
function openEdit(id){var it=items.filter(function(i){return i.id===id})[0];if(!it)return;editId=id;$("name").value=it.n;$("cat").value=it.c;$("date").value=it.d;$("cost").value=it.m||"";$("per").value=it.p||"y";openSheet("EDITAR VENCIMIENTO",true)}
function openSheet(t,ed){$("ft").textContent=t;$("rm").style.display=ed?"block":"none";$("sheet").classList.add("on")}
$("open").onclick=function(){editId=null;$("f").reset();openSheet("NUEVO VENCIMIENTO",false)};
$("sheet").onclick=function(e){if(e.target===this)this.classList.remove("on")};
document.querySelector(".chips").onclick=function(e){var m=e.target.getAttribute("data-add");if(m)$("date").value=addM($("date").value||fmt(new Date()),+m)};
$("f").onsubmit=function(e){e.preventDefault();var o={n:$("name").value.trim(),c:$("cat").value,d:$("date").value,m:+$("cost").value||0,p:$("per").value};
if(editId){items.forEach(function(i){if(i.id===editId){i.n=o.n;i.c=o.c;i.d=o.d;i.m=o.m;i.p=o.p}})}else{o.id=Date.now();items.push(o)}
editId=null;save();this.reset();$("sheet").classList.remove("on");flt="";render();toast("GUARDADO ✓")};
