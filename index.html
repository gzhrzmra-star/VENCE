<!DOCTYPE html>
<html lang="es">
<head>
   <link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#080c24">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VENCE — Expiration OS</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
:root{
--bg:#e9eaf0;
--panel:rgba(255,255,255,.48);
--panel2:rgba(255,255,255,.68);
--line:rgba(255,255,255,.82);
--text:#111522;
--muted:#687086;
--lime:#e3ff4a;
--violet:#8b5cff;
--cyan:#39c8ff;
--pink:#ff5fcf;
--red:#ff547f;
--shadow:0 22px 60px rgba(38,45,90,.18);
--dark:#0b0f20
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}

body{
margin:0;
min-height:100vh;
background:
radial-gradient(circle at 10% 0%,#cfd6ff 0,transparent 32%),
radial-gradient(circle at 100% 80%,#c7f3ff 0,transparent 30%),
var(--bg);
color:var(--text);
font-family:"Space Grotesk",sans-serif;
overflow-x:hidden
}

button,input,select{font:inherit}
button{cursor:pointer}

.orb{
position:fixed;
border-radius:50%;
filter:blur(70px);
pointer-events:none;
z-index:-1
}

.o1{
width:260px;
height:260px;
top:-80px;
left:-80px;
background:#9b78ff
}

.o2{
width:300px;
height:300px;
right:-120px;
top:35%;
background:#47d5ff
}

.o3{
width:220px;
height:220px;
bottom:-90px;
left:20%;
background:#dfff4a;
opacity:.5
}

.grid{
position:fixed;
inset:0;
pointer-events:none;
opacity:.28;
background-image:
linear-gradient(rgba(20,25,50,.08) 1px,transparent 1px),
linear-gradient(90deg,rgba(20,25,50,.08) 1px,transparent 1px);
background-size:38px 38px;
mask-image:radial-gradient(circle at center,#000,transparent 82%)
}

main{
width:min(100%,560px);
margin:auto;
padding:22px 16px 140px
}

.top{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:16px
}

.ey{
font:500 10px "JetBrains Mono";
letter-spacing:.18em;
color:var(--violet)
}

h1{
font-size:30px;
letter-spacing:-.04em;
margin:4px 0
}

.sub{
margin:0;
color:var(--muted);
font-size:14px
}

.clock{
font:500 10px "JetBrains Mono";
color:var(--muted);
text-align:right
}

.glass{
background:linear-gradient(145deg,var(--panel2),var(--panel));
border:1px solid var(--line);
box-shadow:var(--shadow),inset 0 1px rgba(255,255,255,.9);
backdrop-filter:blur(28px) saturate(1.6);
-webkit-backdrop-filter:blur(28px) saturate(1.6)
}

/* =========================================================
   VENCE CORE
========================================================= */

.core{
position:relative;
overflow:hidden;
min-height:430px;
border-radius:36px;
margin-bottom:12px;
background:
radial-gradient(circle at 50% 42%,rgba(139,92,255,.13),transparent 28%),
linear-gradient(145deg,var(--panel2),var(--panel));
border:1px solid var(--line);
box-shadow:
var(--shadow),
inset 0 1px rgba(255,255,255,.95);
backdrop-filter:blur(28px) saturate(1.6);
-webkit-backdrop-filter:blur(28px) saturate(1.6);
isolation:isolate;
}

.core:before{
content:"";
position:absolute;
width:250px;
height:250px;
left:50%;
top:43%;
transform:translate(-50%,-50%);
border-radius:50%;
background:radial-gradient(
circle,
rgba(139,92,255,.18) 0%,
rgba(57,200,255,.08) 38%,
transparent 70%
);
filter:blur(8px);
z-index:-1
}

.core:after{
content:"";
position:absolute;
inset:0;
background:
linear-gradient(
115deg,
transparent 30%,
rgba(255,255,255,.22),
transparent 62%
);
transform:translateX(-120%);
animation:coreSheen 8s ease-in-out infinite;
pointer-events:none
}

@keyframes coreSheen{
45%,100%{transform:translateX(120%)}
}

.coreLabel{
position:absolute;
top:22px;
left:23px;
font:500 9px "JetBrains Mono";
letter-spacing:.2em;
color:var(--muted);
z-index:5
}

.coreIndex{
position:absolute;
top:22px;
right:23px;
font:500 9px "JetBrains Mono";
letter-spacing:.12em;
color:#8990a0;
z-index:5
}

.coreStatus{
position:absolute;
top:51px;
left:23px;
font:500 8px "JetBrains Mono";
letter-spacing:.13em;
color:#9298a5;
z-index:5
}

.coreStatus i{
display:inline-block;
width:6px;
height:6px;
border-radius:50%;
background:var(--lime);
box-shadow:0 0 12px var(--lime);
margin-right:6px
}

.orbit{
position:absolute;
left:50%;
top:43%;
width:280px;
height:280px;
transform:translate(-50%,-50%);
border:1px solid rgba(255,255,255,.15);
border-radius:50%
}

.orbit:before{
content:"";
position:absolute;
inset:25px;
border:1px solid rgba(255,255,255,.11);
border-radius:50%
}

.orbit:after{
content:"";
position:absolute;
inset:58px;
border:1px solid rgba(139,92,255,.2);
border-radius:50%
}

.ring{
position:absolute;
inset:12px;
border-radius:50%;
border:1px dashed rgba(255,255,255,.13);
animation:spin 18s linear infinite
}

.ring:before{
content:"";
position:absolute;
width:6px;
height:6px;
border-radius:50%;
background:var(--lime);
box-shadow:
0 0 10px var(--lime),
0 0 22px rgba(227,255,74,.55);
left:50%;
top:-3px
}

@keyframes spin{
to{transform:rotate(360deg)}
}

.cross{
position:absolute;
left:50%;
top:50%;
width:100%;
height:1px;
background:rgba(255,255,255,.075);
transform:translate(-50%,-50%)
}

.cross.v{
transform:translate(-50%,-50%) rotate(90deg)
}

.coreNumber{
position:absolute;
left:50%;
top:43%;
transform:translate(-50%,-56%);
text-align:center;
z-index:4
}

.days{
font-size:82px;
line-height:.82;
font-weight:600;
letter-spacing:-.08em;
text-shadow:0 8px 35px rgba(60,50,120,.15)
}

.days span{
display:block;
margin-top:13px;
font:500 9px "JetBrains Mono";
letter-spacing:.2em;
color:var(--muted)
}

.pulse{
width:9px;
height:9px;
border-radius:50%;
background:var(--violet);
margin:15px auto 0;
box-shadow:0 0 0 0 rgba(139,92,255,.5);
animation:pulse 2s infinite
}

@keyframes pulse{
70%{
box-shadow:0 0 0 12px rgba(139,92,255,0)
}
100%{
box-shadow:0 0 0 0 rgba(139,92,255,0)
}
}

.coreDot{
position:absolute;
width:7px;
height:7px;
border-radius:50%;
background:#858c99;
box-shadow:0 0 9px rgba(255,255,255,.3);
z-index:5;
transition:.3s ease
}

.coreDot.hot{
background:var(--lime);
box-shadow:
0 0 12px var(--lime),
0 0 22px rgba(227,255,74,.55);
animation:dotPulse 2s infinite
}

@keyframes dotPulse{
50%{transform:scale(1.7)}
}

.d1{left:24%;top:37%}
.d2{left:78%;top:30%}
.d3{left:83%;top:61%}
.d4{left:20%;top:66%}
.d5{left:66%;top:72%}
.d6{left:37%;top:23%}

.coreInfo{
position:absolute;
left:22px;
right:22px;
bottom:21px;
display:flex;
justify-content:space-between;
align-items:end;
gap:14px;
z-index:6
}

.coreInfo small{
display:block;
font:500 8px "JetBrains Mono";
color:#767d86;
letter-spacing:.13em;
margin-bottom:6px
}

.coreName{
font-size:18px;
font-weight:600;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
max-width:310px
}

.coreDate{
margin-top:3px;
color:#9298a0;
font:500 10px "JetBrains Mono"
}

.renewBtn{
border:0;
background:#111522;
color:white;
border-radius:99px;
padding:11px 14px;
font:700 9px "JetBrains Mono";
letter-spacing:.08em;
box-shadow:0 10px 25px rgba(20,25,50,.22);
white-space:nowrap
}

.coreLegend{
display:flex;
justify-content:space-between;
margin:-2px 5px 14px;
padding:0 3px;
color:#707787;
font:500 8px "JetBrains Mono";
letter-spacing:.08em
}

.coreLegend b{
color:var(--violet);
font-weight:500
}

/* =========================================================
   TIMELINE
========================================================= */

.timeline{
border-radius:30px;
padding:18px;
margin-bottom:12px
}

.section{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:12px
}

.section b{
font-size:13px;
letter-spacing:.02em
}

.section span{
font:500 9px "JetBrains Mono";
letter-spacing:.15em;
color:var(--muted)
}

.line{
position:relative;
padding-left:28px
}

.line:before{
content:"";
position:absolute;
left:7px;
top:6px;
bottom:6px;
width:1px;
background:linear-gradient(var(--violet),rgba(139,92,255,.08))
}

.event{
position:relative;
display:flex;
justify-content:space-between;
gap:10px;
padding:10px 0
}

.event:before{
content:"";
position:absolute;
left:-25px;
top:17px;
width:7px;
height:7px;
border-radius:50%;
background:var(--cyan);
box-shadow:0 0 12px currentColor
}

.event.over:before{background:var(--red)}
.event.soon:before{background:var(--lime)}

.eventName{
font-weight:600;
font-size:14px;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis
}

.eventCat{
font:400 10px "JetBrains Mono";
color:var(--muted);
margin-top:3px
}

.eventDate{
text-align:right;
font:500 10px "JetBrains Mono";
color:var(--muted);
white-space:nowrap
}

.eventDate strong{
display:block;
color:var(--text);
font-size:12px
}

.empty{
padding:24px;
text-align:center;
color:var(--muted);
font-size:14px
}

/* =========================================================
   STATS / SEARCH / DOCK / MODAL
========================================================= */

.stats{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px;
margin-bottom:12px
}

.stat{
border-radius:24px;
padding:14px;
background:linear-gradient(145deg,var(--panel2),var(--panel));
border:1px solid var(--line);
box-shadow:var(--shadow),inset 0 1px rgba(255,255,255,.8);
color:var(--text);
text-align:left
}

.stat i{
display:block;
width:8px;
height:8px;
border-radius:50%;
background:currentColor;
box-shadow:0 0 12px currentColor;
margin-bottom:12px
}

.stat b{
display:block;
font-size:28px;
line-height:1
}

.stat small{
display:block;
color:var(--muted);
font:500 9px "JetBrains Mono";
letter-spacing:.08em;
margin-top:6px
}

.over{color:var(--red)}
.soon{color:#8fa900}
.ok{color:#199bd9}

.search{
width:100%;
border-radius:99px;
padding:14px 18px;
border:1px solid var(--line);
outline:none;
color:var(--text);
background:rgba(255,255,255,.4);
backdrop-filter:blur(20px);
margin-bottom:12px
}

.search::placeholder{color:var(--muted)}

.dock{
position:fixed;
bottom:0;
left:0;
right:0;
display:flex;
justify-content:center;
padding:12px 16px calc(16px + env(safe-area-inset-bottom));
z-index:10;
pointer-events:none
}

.add{
pointer-events:auto;
border:1px solid rgba(255,255,255,.45);
border-radius:99px;
padding:8px 8px 8px 24px;
min-width:250px;
display:flex;
align-items:center;
justify-content:space-between;
color:white;
background:linear-gradient(180deg,rgba(255,255,255,.25),rgba(8,10,30,.88));
box-shadow:0 18px 40px rgba(20,25,70,.3),inset 0 1px rgba(255,255,255,.7);
backdrop-filter:blur(22px)
}

.plus{
width:46px;
height:46px;
border-radius:50%;
display:grid;
place-items:center;
background:var(--lime);
color:#101523;
font-size:27px
}

.modal{
position:fixed;
inset:0;
background:rgba(5,8,20,.52);
backdrop-filter:blur(8px);
z-index:20;
display:none;
align-items:end
}

.modal.show{display:flex}

.form{
width:min(100%,560px);
margin:auto 0 0;
border-radius:32px 32px 0 0;
padding:22px 16px calc(22px + env(safe-area-inset-bottom));
display:grid;
gap:10px;
background:#e7e8ef
}

.form h2{
margin:0 0 4px;
font:500 11px "JetBrains Mono";
letter-spacing:.18em
}

.form input,
.form select,
.form textarea{
width:100%;
border:1px solid rgba(255,255,255,.9);
background:rgba(255,255,255,.55);
border-radius:17px;
padding:13px;
color:#111522;
outline:none
}

.form textarea{
resize:vertical;
min-height:75px
}

.two{
display:grid;
grid-template-columns:1fr 1fr;
gap:9px
}

.save{
border:0;
border-radius:99px;
padding:15px;
background:#e3ff4a;
color:#0b1020;
font-weight:700
}

.cancel{
border:0;
background:none;
color:#687086;
padding:7px
}

@media(max-width:380px){
.days{font-size:88px}
.coreName{max-width:230px}
}
</style>
</head>

<body>

<div class="orb o1"></div>
<div class="orb o2"></div>
<div class="orb o3"></div>
<div class="grid"></div>

<main>

<header class="top">
<div>
<div class="ey">VENCE // EXPIRATION OS</div>
<h1 id="greet">Buenos días</h1>
<p class="sub">Tu tiempo, antes de que se venza.</p>
</div>

<div class="clock" id="clock"></div>
</header>


<!-- =====================================================
     VENCE CORE
===================================================== -->

<section class="core">

<div class="coreLabel">VENCE / CORE</div>

<div class="coreIndex" id="coreIndex">00 ITEMS</div>

<div class="coreStatus">
<i></i>
SYSTEM ACTIVE
</div>

<div class="orbit">

<div class="ring"></div>

<div class="cross"></div>
<div class="cross v"></div>

</div>

<div class="coreDot d1"></div>
<div class="coreDot d2"></div>
<div class="coreDot d3"></div>
<div class="coreDot d4"></div>
<div class="coreDot d5"></div>
<div class="coreDot d6"></div>

<div class="coreNumber">

<div class="days" id="daysBig">
—
<span>DAYS REMAINING</span>
</div>

<div class="pulse"></div>

</div>

<div class="coreInfo">

<div style="min-width:0">

<small>NEXT EXPIRATION</small>

<div class="coreName" id="nextName">
Sin vencimientos
</div>

<div class="coreDate" id="nextDate">
Agrega tu primer registro
</div>

</div>

<button class="renewBtn" id="renew">
RENOVAR ↻
</button>

</div>

</section>

<div class="coreLegend">
<span><b>●</b> CORE</span>
<span id="legendSoon">00D</span>
<span>LIVE</span>
<span id="legendTracked">00 TRACKED</span>
</div>


<!-- =====================================================
     TIMELINE
===================================================== -->

<section class="timeline glass">

<div class="section">
<b>Expiration timeline</b>
<span>UPCOMING</span>
</div>

<div class="line" id="timeline"></div>

</section>


<section class="stats">

<button class="stat over" data-filter="overdue">
<i></i>
<b id="overCount">00</b>
<small>VENCIDOS</small>
</button>

<button class="stat soon" data-filter="soon">
<i></i>
<b id="soonCount">00</b>
<small>PRÓXIMOS</small>
</button>

<button class="stat ok" data-filter="ok">
<i></i>
<b id="okCount">00</b>
<small>AL DÍA</small>
</button>

</section>


<input
class="search"
id="search"
placeholder="Buscar vencimiento…"
>


<section class="timeline glass">

<div class="section">
<b id="listTitle">Todos los registros</b>
<span id="total">0 ITEMS</span>
</div>

<div id="list"></div>

</section>

</main>


<div class="dock">

<button class="add" id="add">

<span>Nuevo vencimiento</span>

<i class="plus">+</i>

</button>

</div>


<div class="modal" id="modal">

<form class="form" id="form">

<h2>NUEVO VENCIMIENTO</h2>

<input
id="name"
required
maxlength="70"
placeholder="¿Qué vence? Ej. Seguro del auto"
>

<div class="two">

<select id="cat">

<option>Contrato</option>
<option>Seguro</option>
<option>Garantía</option>
<option>Documento</option>
<option>Suscripción</option>
<option>Otro</option>

</select>

<input
id="date"
type="date"
required
>

</div>

<div class="two">

<input
id="cost"
type="number"
min="0"
step="any"
placeholder="Costo $"
>

<select id="repeat">

<option value="none">No renueva</option>
<option value="month">Cada mes</option>
<option value="year">Cada año</option>

</select>

</div>

<textarea
id="notes"
placeholder="Notas opcionales"
></textarea>

<button class="save">
Guardar vencimiento
</button>

<button
class="cancel"
type="button"
id="cancel"
>
Cancelar
</button>

</form>

</div>


<script>

const KEY='vence-countdown-v2';

let items=JSON.parse(
localStorage.getItem(KEY)||'[]'
);

let filter='all';
let query='';
let next=null;


const $=id=>document.getElementById(id);


const today=()=>{

let d=new Date();

d.setHours(0,0,0,0);

return d;

};


function days(date){

return Math.round(
(
new Date(date+'T00:00:00')-today()
)/864e5
);

}


function status(x){

let d=days(x.date);

return d<0
?'overdue'
:d<=30
?'soon'
:'ok';

}


function fmt(date){

return new Date(date+'T00:00:00')
.toLocaleDateString(
'es-MX',
{
day:'2-digit',
month:'short',
year:'numeric'
}
);

}


function esc(s){

return String(s||'')
.replace(/[&<>"']/g,c=>({
'&':'&amp;',
'<':'&lt;',
'>':'&gt;',
'"':'&quot;',
"'":'&#39;'
}[c]));

}


function save(){

localStorage.setItem(
KEY,
JSON.stringify(items)
);

}


/* =====================================================
   DEMO DATA
===================================================== */

function seed(){

if(items.length)return;

let d=n=>{

let x=today();

x.setDate(x.getDate()+n);

return x.toISOString().slice(0,10);

};

items=[

{
id:1,
name:'Seguro del auto',
cat:'Seguro',
date:d(12),
cost:480,
repeat:'year',
notes:''
},

{
id:2,
name:'Plan de streaming',
cat:'Suscripción',
date:d(20),
cost:12,
repeat:'month',
notes:''
},

{
id:3,
name:'Contrato de alquiler',
cat:'Contrato',
date:d(95),
cost:0,
repeat:'year',
notes:''
},

{
id:4,
name:'Garantía del refrigerador',
cat:'Garantía',
date:d(200),
cost:0,
repeat:'none',
notes:''
},

{
id:5,
name:'Renovar pasaporte',
cat:'Documento',
date:d(-5),
cost:0,
repeat:'none',
notes:''
}

];

save();

}


/* =====================================================
   RENDER
===================================================== */

function render(){

let counts={
overdue:0,
soon:0,
ok:0
};

items.forEach(x=>{
counts[status(x)]++;
});


$('overCount').textContent=
String(counts.overdue).padStart(2,'0');

$('soonCount').textContent=
String(counts.soon).padStart(2,'0');

$('okCount').textContent=
String(counts.ok).padStart(2,'0');


$('total').textContent=
items.length+' ITEMS';

$('coreIndex').textContent=
String(items.length).padStart(2,'0')+' ITEMS';

$('legendTracked').textContent=
String(items.length).padStart(2,'0')+' TRACKED';


let sorted=[...items].sort(
(a,b)=>new Date(a.date)-new Date(b.date)
);


next=sorted.find(
x=>days(x.date)>=0
)||null;


/* =====================================================
   CORE
===================================================== */

if(next){

let d=days(next.date);

$('daysBig').innerHTML=
d+
'<span>DAYS REMAINING</span>';


$('nextName').textContent=
next.name;


$('nextDate').textContent=
d===0
?'Vence hoy · '+fmt(next.date)
:d===1
?'Mañana · '+fmt(next.date)
:'En '+d+' días · '+fmt(next.date);


$('legendSoon').textContent=
String(d).padStart(2,'0')+'D';


$('renew').style.display=
next.repeat==='none'
?'none'
:'block';

}else{

$('daysBig').innerHTML=
'✓<span>ALL CLEAR</span>';

$('nextName').textContent=
'Todo al día';

$('nextDate').textContent=
'No hay vencimientos pendientes';

$('legendSoon').textContent='00D';

$('renew').style.display='none';

}


/* =====================================================
   CORE DOTS
===================================================== */

let dots=document.querySelectorAll('.coreDot');

dots.forEach(
dot=>dot.classList.remove('hot')
);

sorted
.filter(x=>days(x.date)>=0)
.slice(0,dots.length)
.forEach((x,i)=>{

if(i===0){
dots[i].classList.add('hot');
}

});


/* =====================================================
   TIMELINE
===================================================== */

let upcoming=sorted
.filter(x=>days(x.date)>=0)
.slice(0,6);


$('timeline').innerHTML=

upcoming.length

?

upcoming.map(x=>{

let d=days(x.date);
let s=status(x);

return `

<div class="event ${s}">

<div>

<div class="eventName">
${esc(x.name)}
</div>

<div class="eventCat">
${esc(x.cat)}
</div>

</div>

<div class="eventDate">

<strong>
${d===0?'HOY':d+' DÍAS'}
</strong>

${fmt(x.date)}

</div>

</div>

`;

}).join('')

:

'<div class="empty">No hay próximos vencimientos.</div>';


/* =====================================================
   LIST
===================================================== */

let list=sorted.filter(x=>

(filter==='all'||status(x)===filter)

&&

(
!query
||
x.name.toLowerCase().includes(query)
||
x.cat.toLowerCase().includes(query)
)

);


$('listTitle').textContent=

filter==='all'
?'Todos los registros'
:
filter==='overdue'
?'Vencidos'
:
filter==='soon'
?'Próximos 30 días'
:
'Al día';


$('list').innerHTML=

list.length

?

list.map(x=>{

let d=days(x.date);
let s=status(x);

return `

<div
class="event ${s}"
data-id="${x.id}"
style="cursor:pointer"
>

<div>

<div class="eventName">
${esc(x.name)}
</div>

<div class="eventCat">

${esc(x.cat)}

${x.cost
?' · $'+Number(x.cost).toLocaleString('es-MX')
:''}

</div>

</div>

<div class="eventDate">

<strong>

${
d<0
?'HACE '+Math.abs(d)
:
d===0
?'HOY'
:
'EN '+d
}

</strong>

${fmt(x.date)}

</div>

</div>

`;

}).join('')

:

'<div class="empty">No hay vencimientos en esta vista.</div>';

}


/* =====================================================
   CLOCK
===================================================== */

function updateClock(){

let d=new Date();

$('clock').innerHTML=

d.toLocaleTimeString(
'es-MX',
{
hour:'2-digit',
minute:'2-digit'
}
)

+'<br>'+

d.toLocaleDateString(
'es-MX',
{
day:'2-digit',
month:'short'
}
).toUpperCase();


let h=d.getHours();

$('greet').textContent=

h<12
?'Buenos días'
:
h<19
?'Buenas tardes'
:
'Buenas noches';

}


/* =====================================================
   MODAL
===================================================== */

function openModal(){

$('form').reset();

let d=today();

d.setDate(
d.getDate()+30
);

$('date').value=
d.toISOString().slice(0,10);

$('modal').classList.add('show');

$('name').focus();

}


$('add').onclick=openModal;


$('cancel').onclick=()=>
$('modal').classList.remove('show');


$('modal').onclick=e=>{

if(e.target===$('modal')){
$('modal').classList.remove('show');
}

};


/* =====================================================
   SAVE
===================================================== */

$('form').onsubmit=e=>{

e.preventDefault();

items.push({

id:Date.now(),

name:$('name').value.trim(),

cat:$('cat').value,

date:$('date').value,

cost:Number($('cost').value)||0,

repeat:$('repeat').value,

notes:$('notes').value.trim()

});

save();

$('modal').classList.remove('show');

render();

};


/* =====================================================
   FILTERS
===================================================== */

document
.querySelectorAll('[data-filter]')
.forEach(b=>{

b.onclick=()=>{

let f=b.dataset.filter;

filter=
filter===f
?'all'
:f;

render();

};

});


$('search').oninput=e=>{

query=e.target.value
.toLowerCase()
.trim();

render();

};


/* =====================================================
   EDIT
===================================================== */

$('list').onclick=e=>{

let r=e.target.closest('.event');

if(r){
edit(
Number(r.dataset.id)
);
}

};


function edit(id){

let x=items.find(
a=>a.id===id
);

if(!x)return;

let action=confirm(
'¿Renovar este vencimiento?\n\nAceptar = renovar · Cancelar = editar'
);


if(action && x.repeat!=='none'){

let d=
new Date(x.date+'T00:00:00');

d.setMonth(
d.getMonth()+
(x.repeat==='month'?1:12)
);

x.date=
d.toISOString().slice(0,10);

save();

render();

return;

}


$('name').value=x.name;

$('cat').value=x.cat;

$('date').value=x.date;

$('cost').value=x.cost||'';

$('repeat').value=x.repeat;

$('notes').value=x.notes||'';

$('modal').classList.add('show');

}


/* =====================================================
   RENEW CORE
===================================================== */

$('renew').onclick=()=>{

if(
!next ||
next.repeat==='none'
)return;


let d=
new Date(next.date+'T00:00:00');


d.setMonth(
d.getMonth()+
(next.repeat==='month'?1:12)
);


next.date=
d.toISOString().slice(0,10);


save();

render();

};


/* =====================================================
   INIT
===================================================== */

seed();

updateClock();

setInterval(
updateClock,
30000
);

render();

</script>
